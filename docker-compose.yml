name: localperks

services:
  agent-postgres:
    image: pgvector/pgvector:pg16
    profiles: ["agent"]
    restart: unless-stopped
    env_file:
      - path: agent-service/.env.platform
        required: false
    environment:
      POSTGRES_DB: agent_knowledge
      POSTGRES_USER: agent
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - agent-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_knowledge"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dianping
      MYSQL_USER: localperks
      MYSQL_PASSWORD: ${HMDP_DB_PASSWORD:?请先在根目录 .env 中配置 HMDP_DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/db/dianping.sql:/docker-entrypoint-initdb.d/01-dianping.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u localperks -D dianping -e 'SELECT COUNT(*) FROM tb_mq_message' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-init:
    image: redis:7.2-alpine
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./docker/redis/init.lua:/init.lua:ro
    command: ["sh", "-c", "redis-cli -h redis --eval /init.lua | grep -qx 1"]

  rocketmq-init:
    image: apache/rocketmq:5.3.2
    user: "0:0"
    restart: "no"
    volumes:
      - rocketmq-namesrv-logs:/mnt/namesrv-logs
      - rocketmq-broker-logs:/mnt/broker-logs
      - rocketmq-broker-store:/mnt/broker-store
    command: ["sh", "-c", "chown -R rocketmq:rocketmq /mnt/namesrv-logs /mnt/broker-logs /mnt/broker-store"]

  rocketmq-namesrv:
    extends:
      file: docker-compose.rocketmq.yml
      service: rocketmq-namesrv
    restart: unless-stopped
    depends_on:
      rocketmq-init:
        condition: service_completed_successfully
    environment:
      JAVA_OPT_EXT: "-Xms128m -Xmx256m -Xmn64m"
    ports: !override
      - "127.0.0.1:9876:9876"
    volumes:
      - rocketmq-namesrv-logs:/home/rocketmq/logs

  rocketmq-broker:
    extends:
      file: docker-compose.rocketmq.yml
      service: rocketmq-broker
    restart: unless-stopped
    depends_on:
      rocketmq-init:
        condition: service_completed_successfully
      rocketmq-namesrv:
        condition: service_started
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx512m -Xmn128m"
    ports: !override
      - "127.0.0.1:10909:10909"
      - "127.0.0.1:10911:10911"
      - "127.0.0.1:10912:10912"
      - "127.0.0.1:8088:8082"
    volumes:
      - ./docker/rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.2/conf/broker.conf:ro
      - rocketmq-broker-logs:/home/rocketmq/logs
      - rocketmq-broker-store:/home/rocketmq/store
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n rocketmq-namesrv:9876 2>/dev/null | grep -q broker-a"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: hmdp-rocketmq-dashboard
    network_mode: "service:rocketmq-broker"
    depends_on:
      - rocketmq-broker
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=rocketmq-namesrv:9876"
    profiles: ["dashboard"]
    restart: unless-stopped

networks:
  hmdp-rocketmq:
    driver: bridge

volumes:
  agent-pgdata:
  mysql-data:
  redis-data:
  rocketmq-namesrv-logs:
  rocketmq-broker-logs:
  rocketmq-broker-store:
